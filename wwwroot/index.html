<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1116" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ring Game Tracker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ring Game Tracker — Offline Billiards Scorekeeper</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-screen felt-surface flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 bg-slatefelt-900/95 backdrop-blur border-b border-slatefelt-700/80 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="pool-ball stripe w-8 h-8 text-xs" style="--ball-color: #eab308;">
                    <span class="pool-ball-number w-4 h-4 text-[10px]">9</span>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-white leading-none truncate">
                            RingGame <span class="text-emerald-400">Pro</span>
                        </h1>

                    </div>
                    <p id="header-subtitle" class="text-[11px] text-slate-400 font-medium mt-0.5 truncate">Billiards Ring Game Tracker</p>
                </div>
            </div>

            <div id="header-actions" class="flex items-center gap-2 shrink-0">
                <!-- Dynamically populated by render() -->
            </div>
        </div>
    </header>

    <!-- Toast / Non-Blocking Notification Banner -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-md px-4"></div>

    <!-- Main Content Container -->
    <main id="app-root" class="flex-1 max-w-5xl w-full mx-auto px-4 py-5 pb-24">
        <!-- Views rendered via JS -->
    </main>

    <!-- Modal Container -->
    <div id="modal-backdrop" class="hidden fixed inset-0 z-40 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modal-content" class="bg-slatefelt-900 border border-slatefelt-700 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Shared -->
    <script src="js/shared/utilities.js"></script>
    <script src="js/shared/ui.js"></script>


    <!-- Platform -->
    <script src="js/platform/supabase.js"></script>
    <script src="js/platform/auth.js"></script>
    <script src="js/platform/profiles.js"></script>
    <script src="js/platform/sessions.js"></script>
    <script src="js/platform/pwa.js"></script>
    <script src="js/platform/ui.js"></script>


    <!-- Shared Billiards Components -->
    <script src="js/billiards/balls.js"></script>


    <!-- Ring Game -->
    <script src="js/games/ring-game/state.js"></script>
    <script src="js/games/ring-game/settlement.js"></script>
    <script src="js/games/ring-game/engine.js"></script>
    <script src="js/games/ring-game/setup.js"></script>
    <script src="js/games/ring-game/rack-editor.js"></script>
    <script src="js/games/ring-game/rules.js"></script>
    <script src="js/games/ring-game/ui.js"></script>
    <script src="js/games/ring-game/players.js"></script>
    <script src="js/games/ring-game/online.js"></script>


    <!-- Application -->
    <script src="js/app.js"></script>
</body>
</html>
