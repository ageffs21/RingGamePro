  </div>


  <script>
    /**
     * PWA BOOTSTRAP: Inline App Icon (SVG + Canvas PNG), Dynamic Manifest, & Offline Service Worker
     */
(function initOfflinePWA() {
    // Disable service worker caching while developing locally.
    const isDevelopment =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';
    if (isDevelopment) {
        // Remove any previously registered service workers.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(registration => {
                    registration.unregister();
                });
            });
        }
        // Let the normal app finish loading before showing the message.
        window.addEventListener('load', () => {

    }
    // Published version
    if ('serviceWorker' in navigator) {

                })
                .catch(error => {

})();

    /**
     * Pool Ball Color Metadata (Standard WPA / Aramith Colors)
     */
    const BALL_STYLES = {
      1:  { color: '#eab308', stripe: false, name: 'Yellow' },
      2:  { color: '#2563eb', stripe: false, name: 'Blue' },
      3:  { color: '#dc2626', stripe: false, name: 'Red' },
      4:  { color: '#7c3aed', stripe: false, name: 'Purple' },
      5:  { color: '#f97316', stripe: false, name: 'Orange' },
      6:  { color: '#16a34a', stripe: false, name: 'Green' },
      7:  { color: '#881337', stripe: false, name: 'Maroon' },
      8:  { color: '#1e293b', stripe: false, name: 'Black' },
      9:  { color: '#eab308', stripe: true,  name: 'Yellow Stripe' },
      10: { color: '#2563eb', stripe: true,  name: 'Blue Stripe' },
      11: { color: '#dc2626', stripe: true,  name: 'Red Stripe' },
      12: { color: '#7c3aed', stripe: true,  name: 'Purple Stripe' },
      13: { color: '#f97316', stripe: true,  name: 'Orange Stripe' },
      14: { color: '#16a34a', stripe: true,  name: 'Green Stripe' },
      15: { color: '#881337', stripe: true,  name: 'Maroon Stripe' }
    };


    const STORAGE_KEY = 'ringgame_pro_state_v1';


    /**
     * Default Application State
     */
    function getDefaultState() {
      return {
        view: 'setup', // 'setup' | 'live'
        config: {
          playerCount: 4,
          players: [
            { id: 'p1', name: 'Player 1' },
            { id: 'p2', name: 'Player 2' },
            { id: 'p3', name: 'Player 3' },
            { id: 'p4', name: 'Player 4' }
          ],
          format: '10-ball', // '9-ball' | '10-ball' | 'custom'
          moneyBalls: [
            { ball: 5, value: 0.25 },
            { ball: 10, value: 0.50 }
          ],
          useBuyIn: false,
          buyInAmount: 20
        },
        game: null
      };
    }


    let state = loadState();
    let activeTab = 'table'; // 'table' | 'racks' | 'ledger' | 'history'
    let dragSourceIndex = null;
    let editingRackNumber = null;


    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.config) return parsed;
        }
      } catch (e) {
        console.error('Failed to load saved state:', e);
      }
      return getDefaultState();
    }


    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }


    /**
     * Non-blocking Toast Notification
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-slatefelt-800 border-slatefelt-700 text-slate-100',
        success: 'bg-emerald-950/95 border-emerald-500/60 text-emerald-100',
        warning: 'bg-amber-950/95 border-amber-500/60 text-amber-100',
        danger: 'bg-rose-950/95 border-rose-500/60 text-rose-100'
      };
      toast.className = `px-4 py-2.5 rounded-xl border shadow-xl text-sm font-medium backdrop-blur transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);


      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });


      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }


    /**
     * Helper: Render HTML for an authentic pool ball
     */
    function renderPoolBallHTML(num, sizeClass = 'w-10 h-10', numSizeClass = 'w-5 h-5 text-xs') {
      const meta = BALL_STYLES[num] || { color: '#64748b', stripe: false };
      const stripeClass = meta.stripe ? 'stripe' : '';
      const bgStyle = meta.stripe ? `--ball-color: ${meta.color};` : `background-color: ${meta.color};`;
      return `
        <span class="pool-ball ${stripeClass} ${sizeClass}" style="${bgStyle}">
          <span class="pool-ball-number ${numSizeClass}">${num}</span>
        </span>
      `;
    }


    /**
     * Helper: Currency Formatting
     */
    function formatMoney(amount, showPlus = false) {
      const num = Number(amount) || 0;
      const absStr = Math.abs(num).toFixed(2);
      if (num < 0) return `-$${absStr}`;
      if (num > 0 && showPlus) return `+$${absStr}`;
      return `$${absStr}`;
    }


    /**
     * SETUP ACTIONS
     */
    function setPlayerCount(count) {
      const newCount = Math.max(2, Math.min(12, parseInt(count, 10)));
      const current = [...state.config.players];
      if (newCount > current.length) {
        for (let i = current.length; i < newCount; i++) {
          current.push({ id: 'p' + (Date.now() + i), name: `Player ${i + 1}` });
        }
      } else if (newCount < current.length) {
        current.length = newCount;
      }
      state.config.playerCount = newCount;
      state.config.players = current;
      saveState();
      render();
    }


    function updatePlayerName(index, name) {
      state.config.players[index].name = name;
      saveState();
    }


    function movePlayerOrder(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= state.config.players.length) return;
      const arr = state.config.players;
      [arr[index], arr[target]] = [arr[target], arr[index]];
      saveState();
      render();
    }


    function randomizePlayerOrder() {
      const arr = [...state.config.players];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      state.config.players = arr;
      saveState();
      render();
      showToast('Shooting order randomized (pills drawn)!', 'success');
    }


    function setGameFormat(fmt) {
      state.config.format = fmt;
      if (fmt === '9-ball') {
        state.config.moneyBalls = [
          { ball: 5, value: 0.25 },
          { ball: 9, value: 0.50 }
        ];
      } else if (fmt === '10-ball') {
        state.config.moneyBalls = [
          { ball: 5, value: 0.25 },
          { ball: 10, value: 0.50 }
        ];
      }
      saveState();
      render();
    }


    function updateMoneyBallValue(index, val) {
      const parsed = Math.max(0.25, parseFloat(val) || 0);
      state.config.moneyBalls[index].value = parsed;
      saveState();
    }


    function removeMoneyBall(index) {
      if (state.config.moneyBalls.length <= 1) {
        showToast('At least one money ball is required.', 'warning');
        return;
      }
      state.config.moneyBalls.splice(index, 1);
      saveState();
      render();
    }


    function addCustomMoneyBall(ballNum) {
        const num = parseInt(ballNum, 10);

        // Limit the available ball numbers based on game format.
        let maxBall = 15;

        if (state.config.format === '9-ball') {
            maxBall = 9;
        } else if (state.config.format === '10-ball') {
            maxBall = 10;
        }

        if (!num || num < 1 || num > maxBall) {
            return;
        }

        // Prevent duplicate money balls.
        if (state.config.moneyBalls.some(mb => mb.ball === num)) {
            showToast(`Ball #${num} is already a money ball.`, 'warning');
            return;
        }

        state.config.moneyBalls.push({
            ball: num,
            value: 0.25
        });

        state.config.moneyBalls.sort((a, b) => a.ball - b.ball);

        saveState();
        render();
    }


    function toggleBuyIn(enabled) {
      state.config.useBuyIn = enabled;
      saveState();
      render();
    }


    function updateBuyInAmount(val) {
      state.config.buyInAmount = Math.max(1, parseFloat(val) || 20);
      saveState();
    }


    /**
     * START GAME
     */
    function startMatch() {
      try {
        if (!state.config || !Array.isArray(state.config.players) || state.config.players.length < 2) {
          showToast('Please configure at least 2 players before starting.', 'warning');
          return;
        }


        const players = state.config.players.map((p, idx) => ({
          id: p.id || ('p' + (idx + 1)),
          name: (p.name || '').trim() || `Player ${idx + 1}`,
          eliminated: false
        }));


        if (!Array.isArray(state.config.moneyBalls) || state.config.moneyBalls.length === 0) {
          showToast('Add at least one money ball before starting.', 'warning');
          return;
        }


        const moneyBalls = state.config.moneyBalls.map(mb => ({
          ball: Number(mb.ball),
          value: Math.max(0.25, Number(mb.value) || 1)
        }));


        const ledger = {};
        players.forEach(p1 => {
          ledger[p1.id] = {};
          players.forEach(p2 => {
            if (p1.id !== p2.id) ledger[p1.id][p2.id] = 0;
          });
        });


        state.game = {
          startedAt: new Date().toISOString(),
          rackNumber: 1,
          players,
          currentShooterIndex: 0,
          previousShooterIndex: null,
          canPassBack: false,
          moneyBalls,
          useBuyIn: Boolean(state.config.useBuyIn),
          buyInAmount: Math.max(1, Number(state.config.buyInAmount) || 20),
          racks: [
            {
              rackNumber: 1,
              breakerId: players[0].id,
              completed: false,
              pocketedBalls: []
            }
          ],
          ledger,
          history: [],
          snapshots: []
        };


        state.view = 'live';
        activeTab = 'table';
        saveState();
        render();
        showToast(`Rack #1 started! ${players[0].name} breaks.`, 'success');
      } catch (err) {
        console.error('Error starting match:', err);
        showToast('Could not start match. Please check your setup settings.', 'danger');
      }
    }


    /**
     * LIVE GAME ENGINE
     */
    function getCurrentRack() {
      if (!state.game || !state.game.racks || state.game.racks.length === 0) return null;
      return state.game.racks[state.game.racks.length - 1];
    }


    function getPlayerById(id) {
      if (!state.game) return null;
      return state.game.players.find(p => p.id === id) || null;
    }


    function pushSnapshot() {
      if (!state.game) return;
      const snap = {
        rackNumber: state.game.rackNumber,
        players: JSON.parse(JSON.stringify(state.game.players)),
        currentShooterIndex: state.game.currentShooterIndex,
        previousShooterIndex: state.game.previousShooterIndex,
        canPassBack: state.game.canPassBack,
        racks: JSON.parse(JSON.stringify(state.game.racks)),
        ledger: JSON.parse(JSON.stringify(state.game.ledger)),
        history: JSON.parse(JSON.stringify(state.game.history))
      };
      state.game.snapshots.push(snap);
      if (state.game.snapshots.length > 50) {
        state.game.snapshots.shift();
      }
    }


    /**
     * Recalculate entire pairwise ledger and player elimination statuses from all racks
     */
    function recalculateAllBalancesFromRacks() {
      if (!state.game) return;
      const g = state.game;


      g.players.forEach(p => {
        p.eliminated = false;
        g.ledger[p.id] = {};
        g.players.forEach(other => {
          if (p.id !== other.id) g.ledger[p.id][other.id] = 0;
        });
      });


      g.racks.forEach(rack => {
        rack.pocketedBalls.forEach(entry => {
          const shooter = getPlayerById(entry.shooterId);
          if (!shooter) return;


          const activePayers = g.players.filter(p => p.id !== shooter.id && !p.eliminated);
          let totalCollected = 0;
          const breakdown = [];


          activePayers.forEach(payer => {
            let amountOwed = entry.value;


            if (g.useBuyIn) {
              const payerNet = getPlayerNetBalance(payer.id);
              const remainingStack = g.buyInAmount + payerNet;
              if (remainingStack <= amountOwed) {
                amountOwed = Math.max(0, remainingStack);
                payer.eliminated = true;
              }
            }


            if (amountOwed > 0) {
              g.ledger[payer.id][shooter.id] = +(g.ledger[payer.id][shooter.id] + amountOwed).toFixed(2);
              totalCollected = +(totalCollected + amountOwed).toFixed(2);
              breakdown.push({ payerId: payer.id, payerName: payer.name, amount: amountOwed });
            }
          });


          entry.totalCollected = totalCollected;
          entry.breakdown = breakdown;
        });
      });
    }


    function getActivePlayerIndices() {
      if (!state.game) return [];
      return state.game.players
        .map((p, idx) => (!p.eliminated ? idx : -1))
        .filter(idx => idx !== -1);
    }


    function getNextActiveIndex(fromIndex) {
      const total = state.game.players.length;
      for (let step = 1; step <= total; step++) {
        const candidate = (fromIndex + step) % total;
        if (!state.game.players[candidate].eliminated) {
          return candidate;
        }
      }
      return fromIndex;
    }


    function nextShooter() {
      if (!state.game) return;
      const activeIndices = getActivePlayerIndices();
      if (activeIndices.length <= 1) {
        showToast('Only one active player remaining!', 'warning');
        return;
      }


      pushSnapshot();
      const prevIdx = state.game.currentShooterIndex;
      const nextIdx = getNextActiveIndex(prevIdx);


      state.game.previousShooterIndex = prevIdx;
      state.game.currentShooterIndex = nextIdx;
      state.game.canPassBack = true;


      state.game.history.unshift({
        id: Date.now(),
        type: 'turn',
        rack: state.game.rackNumber,
        fromName: state.game.players[prevIdx].name,
        toName: state.game.players[nextIdx].name,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      saveState();
      render();
    }


    function passShotBack() {
      if (!state.game || !state.game.canPassBack || state.game.previousShooterIndex === null) {
        showToast('No previous shot available to pass back.', 'warning');
        return;
      }


      pushSnapshot();
      const currentIdx = state.game.currentShooterIndex;
      const targetIdx = state.game.previousShooterIndex;


      state.game.currentShooterIndex = targetIdx;
      state.game.previousShooterIndex = null;
      state.game.canPassBack = false;


      state.game.history.unshift({
        id: Date.now(),
        type: 'pass_back',
        rack: state.game.rackNumber,
        fromName: state.game.players[currentIdx].name,
        toName: state.game.players[targetIdx].name,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      saveState();
      render();
      showToast(`Shot passed back to ${state.game.players[targetIdx].name}!`, 'info');
    }


    function scoreMoneyBall(ballObj) {
      if (!state.game) return;
      const activeIndices = getActivePlayerIndices();
      if (activeIndices.length <= 1) {
        showToast('Game over — only 1 player remains.', 'warning');
        return;
      }


      const currentRack = getCurrentRack();
      if (!currentRack) return;


      if (currentRack.pocketedBalls.some(pb => pb.ball === ballObj.ball)) {
        showToast(`The ${ballObj.ball}-ball was already pocketed in Rack #${currentRack.rackNumber}.`, 'warning');
        return;
      }


      pushSnapshot();


      const shooterIdx = state.game.currentShooterIndex;
      const shooter = state.game.players[shooterIdx];
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });


      const pocketRecord = {
        id: 'pb_' + Date.now() + '_' + ballObj.ball,
        ball: ballObj.ball,
        value: ballObj.value,
        shooterId: shooter.id,
        totalCollected: 0,
        breakdown: [],
        timestamp: timeStr
      };


      currentRack.pocketedBalls.push(pocketRecord);
      recalculateAllBalancesFromRacks();


      state.game.canPassBack = false;
      state.game.previousShooterIndex = null;


      const eventEntry = {
        id: Date.now(),
        type: 'money_ball',
        rack: state.game.rackNumber,
        shooterId: shooter.id,
        shooterName: shooter.name,
        ball: ballObj.ball,
        ballValue: ballObj.value,
        totalCollected: pocketRecord.totalCollected,
        breakdown: pocketRecord.breakdown,
        timestamp: timeStr
      };


      state.game.history.unshift(eventEntry);


      const allMoneyBallsPocketed = state.game.moneyBalls.every(mb =>
        currentRack.pocketedBalls.some(pb => pb.ball === mb.ball)
      );


      if (allMoneyBallsPocketed && getActivePlayerIndices().length > 1) {
        advanceToNextRackInternal(shooterIdx, `All money balls cleared! ${shooter.name} collected +${formatMoney(pocketRecord.totalCollected)} & breaks Rack #${state.game.rackNumber + 1}!`);
      } else {
        const remainingCount = state.game.moneyBalls.length - currentRack.pocketedBalls.length;
        saveState();
        render();
        showToast(
          `${shooter.name} pocketed the ${ballObj.ball}-ball (+${formatMoney(pocketRecord.totalCollected)})! ${remainingCount} money ball${remainingCount === 1 ? '' : 's'} left in rack.`,
          'success'
        );
      }
    }


    function advanceToNextRackInternal(breakerIdx, customToastMsg) {
      const g = state.game;
      const currentRack = getCurrentRack();
      if (currentRack) {
        currentRack.completed = true;
      }


      const nextRackNum = g.rackNumber + 1;
      const breaker = g.players[breakerIdx];


      g.rackNumber = nextRackNum;
      g.currentShooterIndex = breakerIdx;
      g.previousShooterIndex = null;
      g.canPassBack = false;


      g.racks.push({
        rackNumber: nextRackNum,
        breakerId: breaker.id,
        completed: false,
        pocketedBalls: []
      });


      g.history.unshift({
        id: Date.now() + 1,
        type: 'new_rack',
        rack: nextRackNum,
        breakerName: breaker.name,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      saveState();
      render();
      if (customToastMsg) {
        showToast(customToastMsg, 'success');
      }
    }


    function openNextRackModal() {
      if (!state.game) return;
      const g = state.game;
      const currentRack = getCurrentRack();
      const activeIndices = getActivePlayerIndices();


      let defaultBreakerIdx = g.currentShooterIndex;
      if (currentRack && currentRack.pocketedBalls.length > 0) {
        const lastPocket = currentRack.pocketedBalls[currentRack.pocketedBalls.length - 1];
        const foundIdx = g.players.findIndex(p => p.id === lastPocket.shooterId && !p.eliminated);
        if (foundIdx !== -1) defaultBreakerIdx = foundIdx;
      }


      const unpocketed = g.moneyBalls.filter(
        mb => !currentRack.pocketedBalls.some(pb => pb.ball === mb.ball)
      );


      const html = `
        <div class="p-5 sm:p-6">

    /**
     * FINANCIAL & DEBT SIMPLIFICATION CALCULATIONS
     */
    function getPlayerNetBalance(playerId) {
      if (!state.game) return 0;
      let net = 0;
      state.game.players.forEach(other => {
        if (other.id === playerId) return;
        const owedToMe = state.game.ledger[other.id]?.[playerId] || 0;
        const iOweThem = state.game.ledger[playerId]?.[other.id] || 0;
        net += (owedToMe - iOweThem);
      });
      return +net.toFixed(2);
    }


    function getPairwiseNetDebts() {
      if (!state.game) return [];
      const debts = [];
      const players = state.game.players;
      for (let i = 0; i < players.length; i++) {
        for (let j = i + 1; j < players.length; j++) {
          const pA = players[i];
          const pB = players[j];
          const bOwesA = state.game.ledger[pB.id]?.[pA.id] || 0;
          const aOwesB = state.game.ledger[pA.id]?.[pB.id] || 0;
          const diff = +(bOwesA - aOwesB).toFixed(2);
          if (diff > 0.005) {
            debts.push({ from: pB, to: pA, amount: diff });
          } else if (diff < -0.005) {
            debts.push({ from: pA, to: pB, amount: Math.abs(diff) });
          }
        }
      }
      return debts.sort((a, b) => b.amount - a.amount);
    }


    function getSimplifiedSettlements() {
      if (!state.game) return [];
      const debtors = [];
      const creditors = [];


      state.game.players.forEach(p => {
        const net = getPlayerNetBalance(p.id);
        if (net < -0.005) {
          debtors.push({ player: p, amount: Math.abs(net) });
        } else if (net > 0.005) {
          creditors.push({ player: p, amount: net });
        }
      });


      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);


      const settlements = [];
      let i = 0;
      let j = 0;


      while (i < debtors.length && j < creditors.length) {
        const d = debtors[i];
        const c = creditors[j];
        const transfer = +Math.min(d.amount, c.amount).toFixed(2);


        if (transfer > 0.005) {
          settlements.push({
            from: d.player,
            to: c.player,
            amount: transfer
          });
        }


        d.amount = +(d.amount - transfer).toFixed(2);
        c.amount = +(c.amount - transfer).toFixed(2);


        if (d.amount <= 0.005) i++;
        if (c.amount <= 0.005) j++;
      }


      return settlements;
    }

    function updateRackBreaker(rackNumber, newBreakerId) {
      const rack = state.game.racks.find(r => r.rackNumber === rackNumber);
      if (!rack) return;
      pushSnapshot();
      rack.breakerId = newBreakerId;
      saveState();
      render();
      renderEditRackModalContent();
      showToast(`Updated Rack #${rackNumber} breaker.`, 'info');
    }


    function reassignPocketedBallShooter(rackNumber, pocketIndex, newShooterId) {
      const rack = state.game.racks.find(r => r.rackNumber === rackNumber);
      if (!rack || !rack.pocketedBalls[pocketIndex]) return;
      pushSnapshot();
      const entry = rack.pocketedBalls[pocketIndex];
      entry.shooterId = newShooterId;
      recalculateAllBalancesFromRacks();


      const shooter = getPlayerById(newShooterId);
      state.game.history.unshift({
        id: Date.now(),
        type: 'rack_edit',
        rack: rackNumber,
        description: `Reassigned ${entry.ball}-Ball in Rack #${rackNumber} to ${shooter ? shooter.name : 'player'}`,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      saveState();
      render();
      renderEditRackModalContent();
      showToast(`Reassigned ${entry.ball}-Ball & recalculated balances.`, 'success');
    }


    function deletePocketedBallFromRack(rackNumber, pocketIndex) {
      const rack = state.game.racks.find(r => r.rackNumber === rackNumber);
      if (!rack || !rack.pocketedBalls[pocketIndex]) return;
      pushSnapshot();
      const [removed] = rack.pocketedBalls.splice(pocketIndex, 1);
      recalculateAllBalancesFromRacks();


      state.game.history.unshift({
        id: Date.now(),
        type: 'rack_edit',
        rack: rackNumber,
        description: `Removed ${removed.ball}-Ball from Rack #${rackNumber}`,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      saveState();
      render();
      renderEditRackModalContent();
      showToast(`Removed ${removed.ball}-Ball from Rack #${rackNumber}.`, 'info');
    }


    function addMissedBallToRack(rackNumber) {
      const rack = state.game.racks.find(r => r.rackNumber === rackNumber);
      if (!rack) return;
      const ballSelect = document.getElementById('edit-rack-add-ball');
      const playerSelect = document.getElementById('edit-rack-add-player');
      if (!ballSelect || !playerSelect) return;


      const ballNum = parseInt(ballSelect.value, 10);
      const shooterId = playerSelect.value;
      const mbConfig = state.game.moneyBalls.find(m => m.ball === ballNum);
      if (!mbConfig) return;


      pushSnapshot();
      rack.pocketedBalls.push({
        id: 'pb_edit_' + Date.now(),
        ball: ballNum,
        value: mbConfig.value,
        shooterId,
        totalCollected: 0,
        breakdown: [],
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      recalculateAllBalancesFromRacks();


      const shooter = getPlayerById(shooterId);
      state.game.history.unshift({
        id: Date.now(),
        type: 'rack_edit',
        rack: rackNumber,
        description: `Added missed ${ballNum}-Ball in Rack #${rackNumber} for ${shooter ? shooter.name : 'player'}`,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });


      saveState();
      render();
      renderEditRackModalContent();
      showToast(`Added ${ballNum}-Ball to Rack #${rackNumber} & updated balances.`, 'success');
    }


    function handleDragStart(e, index) {
      dragSourceIndex = index;
      e.dataTransfer.effectAllowed = 'move';
    }


    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }


    function handleDrop(e, targetIndex) {
      e.preventDefault();
      if (dragSourceIndex === null || dragSourceIndex === targetIndex) return;
      const list = state.config.players;
      const [moved] = list.splice(dragSourceIndex, 1);
      list.splice(targetIndex, 0, moved);
      dragSourceIndex = null;
      saveState();
      render();
    }

     * XSS Escaping Helper
     */
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

                        Breaker: <strong class="text-slate-200">${escapeHTML(breaker ? breaker.name : 'Unknown')}</strong>
                      </span>
                    </div>


                    <div class="flex items-center gap-3">
                      <span class="text-xs font-mono text-slate-300">
                        Pot: <strong class="text-emerald-400">${formatMoney(rackTotalPot)}</strong>
                      </span>
                      <button
                        onclick="openEditRackModal(${rack.rackNumber})"
                        class="px-3 py-1.5 rounded-lg bg-slatefelt-800 hover:bg-blue-600/25 hover:border-blue-500/50 hover:text-blue-300 border border-slatefelt-700 text-xs font-bold text-slate-200 transition">
                        ✎ Edit Rack
                      </button>
                    </div>
                  </div>


                  ${rack.pocketedBalls.length === 0 ? `
                    <div class="pt-3 text-xs text-slate-500 italic">
                      No money balls pocketed in this rack yet.
                    </div>
                  ` : `
                    <div class="pt-3 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      ${rack.pocketedBalls.map(pb => {
                        const shooter = getPlayerById(pb.shooterId);
                        return `
                          <div class="flex items-center justify-between bg-slatefelt-850 border border-slatefelt-700/60 rounded-xl p-3">
                            <div class="flex items-center gap-3">
                              ${renderPoolBallHTML(pb.ball, 'w-9 h-9', 'w-4 h-4 text-[11px]')}
                              <div>
                                <div class="text-sm font-bold text-white">
                                  ${escapeHTML(shooter ? shooter.name : 'Unknown')}
                                </div>
                                <div class="text-[11px] text-slate-400">
                                  Made ${pb.ball}-Ball (${formatMoney(pb.value)}/ea)
                                </div>
                              </div>
                            </div>


                            <div class="font-mono font-extrabold text-sm text-emerald-400">
                              +${formatMoney(pb.totalCollected)}
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  `}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }


    function switchTab(tab) {
      activeTab = tab;
      render();
    }


    /**
     * MAIN RENDER CONTROLLER
     */
    function render() {
        const root = document.getElementById('app-root');
        const headerActions = document.getElementById('header-actions');
        const subtitle = document.getElementById('header-subtitle');

        // Rules button is available from every screen.
        const rulesButton = `
        <button
          onclick="openRulesModal()"
          class="px-3 py-1.5 rounded-xl bg-slatefelt-800 hover:bg-slatefelt-700 border border-slatefelt-700 text-slate-300 hover:text-white font-semibold text-xs transition"
        >
          <span class="text-emerald-400 font-black">?</span>
          Rules
        </button>
      `;

        if (state.view === 'live' && state.game) {

            subtitle.textContent =
                `${state.config.format.toUpperCase()} • ${state.game.players.length} Players`;

            headerActions.innerHTML = `
          ${rulesButton}

          <button
            onclick="openEndGameModal()"
            class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition shadow"
          >
            Settle Up
          </button>

          <button
            onclick="confirmResetModal()"
            class="px-3 py-1.5 rounded-xl bg-slatefelt-800 hover:bg-slatefelt-700 border border-slatefelt-700 text-slate-300 font-semibold text-xs transition"
          >
            New Game
          </button>
        `;

            root.innerHTML = renderLiveView();

        } else {

            subtitle.textContent = 'Billiards Ring Game Tracker';

            headerActions.innerHTML = `
          ${rulesButton}
        `;

            root.innerHTML = renderSetupView();

            const startBtn = document.getElementById('start-match-btn');

            if (startBtn) {
                startBtn.onclick = null;

                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    startMatch();
                });
            }
        }
    }


    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') {
        closeModal();
      }
    });


    // Initial Render
    render();
  </script>
</body>
</html>
